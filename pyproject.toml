[project]
name = "real-estate-manager"
version = "0.1.0"
description = "Gestion de patrimoine locatif (biens, gestionnaires, locataires, suivi financier)"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
