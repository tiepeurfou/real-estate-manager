{% extends "base.html" %}

{% block titre %}Clôturer le bail — Real Estate Manager{% endblock %}

{% block contenu %}
<h1>Clôturer le bail</h1>

{% if erreur %}
    <p class="erreur">{{ erreur }}</p>
{% endif %}

<form method="post" action="{{ url_for('occupation_cloturer', occupation_id=occupation.id) }}">
    <label for="date_sortie">Date de sortie</label>
    <input type="date" id="date_sortie" name="date_sortie" required>
    <button type="submit">Confirmer</button>
</form>
{% endblock %}
