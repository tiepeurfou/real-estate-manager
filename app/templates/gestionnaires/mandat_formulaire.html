{% extends "base.html" %}

{% block titre %}Lier une unité — {{ gestionnaire.nom }}{% endblock %}

{% block contenu %}
<h1>Lier une unité à {{ gestionnaire.nom }}</h1>

{% if erreur %}
    <p class="erreur">{{ erreur }}</p>
{% endif %}

<form method="post" action="{{ url_for('mandat_creer', gestionnaire_id=gestionnaire.id) }}">
    <label for="unite_locative_id">Unité locative</label>
    <select id="unite_locative_id" name="unite_locative_id" required>
        {% for unite in unites %}
        {% set bien = biens_par_id.get(unite.bien_id) %}
        <option value="{{ unite.id }}">{{ bien.libelle if bien else "?" }} — {{ unite.libelle }}</option>
        {% endfor %}
    </select>

    <label for="role">Rôle</label>
    <select id="role" name="role" required>
        {% for r in roles %}
        <option value="{{ r.value }}">{{ r.value }}</option>
        {% endfor %}
    </select>

    <label for="date_debut">Date de début</label>
    <input type="date" id="date_debut" name="date_debut" required>

    <button type="submit">Enregistrer</button>
</form>
{% endblock %}
