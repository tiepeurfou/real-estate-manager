{% extends "base.html" %}

{% block titre %}{{ "Modifier" if gestionnaire else "Ajouter" }} un gestionnaire — Real Estate Manager{% endblock %}

{% block contenu %}
<h1 class="h3 mb-4">{{ "Modifier" if gestionnaire else "Ajouter" }} un gestionnaire</h1>

<div class="card carte-ombre carte-formulaire">
    <div class="card-body p-4">
        {% if erreur %}
            <div class="alert alert-danger">{{ erreur }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('gestionnaire_modifier', gestionnaire_id=gestionnaire.id) if gestionnaire else url_for('gestionnaire_creer') }}"
              x-data='{ contacts: {{ contacts_json | safe }} }'>
            <div class="mb-3">
                <label for="nom" class="form-label">Nom</label>
                <input type="text" class="form-control" id="nom" name="nom" value="{{ gestionnaire.nom if gestionnaire else '' }}" required>
            </div>

            <label class="form-label">Contacts (emails, téléphones)</label>
            <template x-for="(contact, index) in contacts" :key="index">
                <div class="d-flex gap-2 mb-2">
                    <select x-model="contact.type" name="contact_type" class="form-select" style="max-width: 9rem;">
                        <option value="email">Email</option>
                        <option value="telephone">Téléphone</option>
                    </select>
                    <input type="text" x-model="contact.valeur" name="contact_valeur" class="form-control" placeholder="valeur">
                    <button type="button" class="btn btn-outline-danger" x-on:click="contacts.splice(index, 1)">&times;</button>
                </div>
            </template>
            <button type="button" class="btn btn-sm btn-outline-secondary mb-4" x-on:click="contacts.push({type: 'email', valeur: ''})">+ Ajouter un contact</button>

            <div>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
