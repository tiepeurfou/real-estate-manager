{% extends "base.html" %}

{% block titre %}{{ "Modifier" if gestionnaire else "Ajouter" }} un gestionnaire — Real Estate Manager{% endblock %}

{% block contenu %}
<h1>{{ "Modifier" if gestionnaire else "Ajouter" }} un gestionnaire</h1>

{% if erreur %}
    <p class="erreur">{{ erreur }}</p>
{% endif %}

<form method="post" action="{{ url_for('gestionnaire_modifier', gestionnaire_id=gestionnaire.id) if gestionnaire else url_for('gestionnaire_creer') }}">
    <label for="nom">Nom</label>
    <input type="text" id="nom" name="nom" value="{{ gestionnaire.nom if gestionnaire else '' }}" required>

    <label for="contact_email">Email de contact</label>
    <input type="email" id="contact_email" name="contact_email" value="{{ gestionnaire.contact_email if gestionnaire and gestionnaire.contact_email else '' }}">

    <label for="contact_tel">Téléphone de contact</label>
    <input type="text" id="contact_tel" name="contact_tel" value="{{ gestionnaire.contact_tel if gestionnaire and gestionnaire.contact_tel else '' }}">

    <label for="compte_bancaire_id">Compte bancaire associé</label>
    <select id="compte_bancaire_id" name="compte_bancaire_id">
        <option value="">—</option>
        {% for compte in comptes %}
        <option value="{{ compte.id }}" {{ "selected" if gestionnaire and gestionnaire.compte_bancaire_id == compte.id else "" }}>{{ compte.libelle }}</option>
        {% endfor %}
    </select>

    <button type="submit">Enregistrer</button>
</form>
{% endblock %}
