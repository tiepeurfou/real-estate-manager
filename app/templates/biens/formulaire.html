{% extends "base.html" %}

{% block titre %}{{ "Modifier" if bien else "Ajouter" }} un bien — Real Estate Manager{% endblock %}

{% block contenu %}
<h1 class="h3 mb-4">{{ "Modifier" if bien else "Ajouter" }} un bien</h1>

<div class="card carte-ombre carte-formulaire">
    <div class="card-body p-4">
        {% if erreur %}
            <div class="alert alert-danger">{{ erreur }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('bien_modifier', bien_id=bien.id) if bien else url_for('bien_creer') }}">
            {% if not bien %}
            <div class="mb-3">
                <label for="type" class="form-label">Type</label>
                <select id="type" name="type" class="form-select" required>
                    {% for t in types_bien %}
                    <option value="{{ t.value }}">{{ t.value }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div class="mb-3">
                <label for="libelle" class="form-label">Libellé</label>
                <input type="text" class="form-control" id="libelle" name="libelle" value="{{ bien.libelle if bien else '' }}" required>
            </div>

            <div class="mb-3">
                <label for="adresse_rue" class="form-label">Adresse</label>
                <input type="text" class="form-control" id="adresse_rue" name="adresse_rue" value="{{ bien.adresse_rue if bien else '' }}" required>
            </div>

            <div class="row">
                <div class="col-sm-4 mb-3">
                    <label for="adresse_code_postal" class="form-label">Code postal</label>
                    <input type="text" class="form-control" id="adresse_code_postal" name="adresse_code_postal" value="{{ bien.adresse_code_postal if bien else '' }}" required>
                </div>
                <div class="col-sm-8 mb-3">
                    <label for="adresse_ville" class="form-label">Ville</label>
                    <input type="text" class="form-control" id="adresse_ville" name="adresse_ville" value="{{ bien.adresse_ville if bien else '' }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="date_acquisition" class="form-label">Date d'acquisition</label>
                <input type="date" class="form-control" id="date_acquisition" name="date_acquisition" value="{{ bien.date_acquisition if bien and bien.date_acquisition else '' }}">
            </div>

            <div class="mb-4">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3">{{ bien.notes if bien and bien.notes else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </form>
    </div>
</div>
{% endblock %}
